            - link [ref=f8e45] [cursor=pointer]:
              - /url: /patterns/intermediate-currency
              - generic [ref=f8e47]:
                - heading "Intermediate Currency" [level=3] [ref=f8e48]
                - paragraph [ref=f8e49]: The Intermediate Currency pattern introduces an artificial layer of abstraction between the user's fiat money and the digital goods or services they wish to purchase. Distinct from general price comparison prevention, this pattern relies strictly on transactional coercion—forcing users to first buy a platform-specific virtual currency (e.g., “gems”, “tokens”, or “coins”). By enforcing this exchange redirection, the interface cognitively decouples the perceived cost from the actual real-world financial impact, leveraging the “fiduciary abstraction” effect to significantly reduce the psychological pain of paying. Furthermore, this pattern frequently employs asymmetric denominations, leaving the user with an unspendable remainder. This residual balance exploits mental accounting principles, acting as a sunk cost that pressures the user into initiating future, otherwise unintended purchases.
              - generic [ref=f8e50]:
                - generic [ref=f8e51]: Sneaking
                - generic [ref=f8e56]: Read
            - link "Disguised Ad The Disguised Ad pattern is a visual manipulation technique where promotional content is engineered to mimic native interface elements, such as navigation menus, editorial content, or primary action buttons (e.g., a fake “Download” button). This pattern deliberately weaponizes Gestalt phenomena to blur the boundary between figure and ground, causing the advertisement to seamlessly blend into the host interface's contexture. By doing so, it exploits users' acquired “banner blindness”—the cognitive heuristic where users subconsciously filter out traditional ad formats—inducing erroneous interaction with the promotional material under the false premise of operating the native application. Sneaking Read" [ref=f8e59] [cursor=pointer]:
              - /url: /patterns/disguised-ad
              - generic [ref=f8e61]:
                - heading "Disguised Ad" [level=3] [ref=f8e62]
                - paragraph [ref=f8e63]: The Disguised Ad pattern is a visual manipulation technique where promotional content is engineered to mimic native interface elements, such as navigation menus, editorial content, or primary action buttons (e.g., a fake “Download” button). This pattern deliberately weaponizes Gestalt phenomena to blur the boundary between figure and ground, causing the advertisement to seamlessly blend into the host interface's contexture. By doing so, it exploits users' acquired “banner blindness”—the cognitive heuristic where users subconsciously filter out traditional ad formats—inducing erroneous interaction with the promotional material under the false premise of operating the native application.
              - generic [ref=f8e64]:
